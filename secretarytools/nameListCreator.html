<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>接龍姓名匯出 - 秘書工具箱</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #a87a4f;
            --accent-color: #d4a373;
            --bg-color: #fdfaf3;
            --card-bg: #ffffff;
            --text-main: #3d2c1b;
            --text-secondary: #6b4f35;
            --shadow: 0 10px 25px rgba(168, 122, 79, 0.1);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
            font-size: 18px;
            line-height: 1.6;
        }
        .container {
            width: 100%;
            max-width: 800px;
        }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 36px; color: var(--primary-color); margin-bottom: 12px; }
        .header p { color: var(--text-secondary); font-size: 16px; }
        
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--primary-color);
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            transition: var(--transition);
        }
        .back-btn:hover {
            color: var(--accent-color);
            transform: translateX(-5px);
        }

        .tool-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 40px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(168, 122, 79, 0.1);
        }
        .input-group { margin-bottom: 20px; }
        label {
            font-weight: 600;
            color: var(--primary-color);
            font-size: 14px;
            margin-bottom: 8px;
            display: block;
        }
        .input-group > label {
            font-size: 16px;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #e0d5c8;
            font-size: 16px;
            font-family: inherit;
            background: #fff;
            transition: var(--transition);
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 4px rgba(212, 163, 115, 0.1);
        }
        textarea {
            min-height: 200px;
            resize: vertical;
        }
        
        .output-group {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 24px;
            border: 1px dashed var(--accent-color);
            position: relative;
        }
        #output {
            min-height: 150px;
            background: transparent;
            border: none;
            padding: 0;
            resize: vertical;
        }

        .actions { display: flex; gap: 15px; margin: 30px 0; }
        button {
            padding: 12px 24px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            transition: var(--transition);
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-family: inherit;
            gap: 8px;
        }
        .btn-primary { background-color: var(--primary-color); color: white; flex: 2;}
        .btn-primary:hover:not(:disabled) { background-color: var(--accent-color); transform: translateY(-2px); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .btn-secondary {
            background-color: transparent;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            flex: 1;
        }
        .btn-secondary:hover {
            background-color: var(--bg-color);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .btn-full {
            width: 100%;
            margin-top: 20px;
            padding: 16px;
            font-size: 18px;
        }

        .copy-toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--text-main);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transform: translateY(100px);
            opacity: 0;
            transition: var(--transition);
        }

        .copy-toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        
        @media (max-width: 640px) {
            body { padding: 20px 15px; }
            .tool-card { padding: 25px 20px; }
            .header h1 { font-size: 28px; }
            .actions { flex-direction: column; }
            .actions button { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <main>
            <a href="index.html" class="back-btn">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"></path>
                </svg>
                返回工具箱
            </a>

            <div class="header">
                <h1>接龍姓名匯出</h1>
                <p>將接龍訊息姓名列表轉換為逗號分隔的格式，方便複製使用。</p>
            </div>

            <div class="tool-card">
                <div class="input-group">
                    <label for="input">輸入原始清單</label>
                    <textarea id="input" placeholder="OOO活動，請接龍&#10;1. 哆啦A夢&#10;2. 唐老鴨&#10;3. 柯南"></textarea>
                </div>

                <div class="actions">
                    <button class="btn-primary" onclick="formatNames()">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                        </svg>
                        立即轉換
                    </button>
                    <button class="btn-secondary" onclick="clearAll()">清除</button>
                </div>

                <div class="input-group">
                    <label>轉換結果（可編輯）<span id="nameCount" style="margin-left: 8px; font-weight: normal; font-size: 14px; color: var(--accent-color);"></span></label>
                    <div class="output-group">
                        <textarea id="output" placeholder="尚未轉換..."></textarea>
                    </div>
                </div>

                <button class="btn-primary btn-full" onclick="copyResult()">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m-0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
                    </svg>
                    複製結果
                </button>
            </div>
        </main>
    </div>

    <div id="toast" class="copy-toast">已複製到剪貼簿！</div>

    <script>
        function formatNames() {
            const input = document.getElementById('input').value;
            if (!input.trim()) { alert('請先輸入文字'); return; }
            
            const lines = input.split('\n');
            let firstLineIndex = -1;
            const numRegex = /^\s*[0-9①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳(（\[【]/;
            for (let i = 0; i < lines.length; i++) {
                if (numRegex.test(lines[i])) {
                    firstLineIndex = i;
                    break;
                }
            }

            let textToProcess = input;
            if (firstLineIndex !== -1) {
                textToProcess = lines.slice(firstLineIndex).join('\n');
            }

            const items = textToProcess.split(/[\n,，、;；]/).map(s => s.trim()).filter(Boolean);
            
            const skipKeywords = [
                '接龍', '截止', '注意事項', '時間', '地點', '提醒', '謝謝', 
                '統計', '人數', '講座', '活動', '報名', '清單', '分享',
                '月例會', '會議', '聯絡', '大家', '各位', '恭喜', '備註',
                '說明', '群組', '主旨', '目的', '對象', '日期', '地點', '講師'
            ];

            const parsed = [];
            for (let item of items) {
                // 檢查是否含有過濾關鍵字
                const hasKeyword = skipKeywords.some(kw => item.includes(kw));
                if (hasKeyword) continue;

                const raw = item;
                // 1. 移除前置編號及標點符號 (例如: "1.", "2、", "10. ", "①", "(1)")
                item = item.replace(/^[0-9\s.、。()（）\[\]【】①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳\-—+_]+/, '').trim();

                // 2. 移除尾端括號及其內容 (例如: "(隨喜)", "（開車）", "[備註]")
                item = item.replace(/[\s(（\[【][^()（）\[\]_【】]*[)）\]】]$/, '').trim();

                // 3. 移除破折號、冒號等備註部分 (例如: "張三 - 隨喜", "李四: 帶水")
                let name = item;
                let note = '';
                const m = item.match(/^(.*?)[\-–—:\：\s\+]+(.+)$/);
                if (m) {
                    const part1 = m[1].trim();
                    if (part1.length >= 2 && part1.length <= 6) {
                        name = part1;
                        note = m[2].trim().replace(/[。\.]+$/,'');
                    }
                }

                // 清除內部多餘空格
                name = name.replace(/\s+/g, '').trim();

                // 最終檢查：長度在 2 ~ 8 字之間，且不為空
                if (name && name.length >= 2 && name.length <= 8) {
                    parsed.push({ name, note, raw });
                }
            }

            document.getElementById('output').value = parsed.map(p => p.name).join(',');
            document.getElementById('nameCount').textContent = `（共 ${parsed.length} 人）`;
        }

        function clearAll() {
            document.getElementById('input').value = '';
            document.getElementById('output').value = '';
            document.getElementById('nameCount').textContent = '';
        }

        function copyResult() {
            const output = document.getElementById('output').value;
            if (!output) return;

            navigator.clipboard.writeText(output).then(() => {
                showToast();
            }).catch(err => {
                console.error('複製失敗:', err);
                alert('複製失敗，請手動選取複製');
            });
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }
    </script>
</body>
</html>
